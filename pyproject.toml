[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-python-lab"
version = "0.1.0"
description = "Learn Python genomics by scanning DNA for CRISPR guide candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CRISPR Python Lab contributors"}]

[project.scripts]
crispr-scan = "crispr_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
